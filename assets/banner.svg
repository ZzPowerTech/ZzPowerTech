<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Murillo Weiss Kist — Software Engineer · Back-end Developer · Tech Lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1f1b2e"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E40C9"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9b6ff"/>
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6E40C9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6E40C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Decorative glows -->
  <circle cx="1050" cy="80" r="220" fill="url(#glow1)"/>
  <circle cx="1140" cy="240" r="180" fill="url(#glow2)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Left vertical accent -->
  <rect x="48" y="70" width="4" height="180" rx="2" fill="url(#accent)"/>

  <!-- Main heading -->
  <g transform="translate(72,118)" filter="url(#soft)">
    <text font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#nameGrad)" letter-spacing="-0.5">
      Murillo Weiss Kist
    </text>
  </g>

  <!-- Subtitle / Role -->
  <g transform="translate(72,158)">
    <text font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="22" font-weight="600" fill="#9ca3af" letter-spacing="2">
      SOFTWARE ENGINEER  ·  BACK-END DEVELOPER  ·  TECH LEAD
    </text>
  </g>

  <!-- Tech chips -->
  <g transform="translate(72,200)" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600">
    <!-- Java -->
    <g transform="translate(0,0)">
      <rect width="92" height="32" rx="8" fill="#1c1f26" stroke="#f89820" stroke-width="1.5"/>
      <circle cx="14" cy="16" r="4" fill="#f89820"/>
      <text x="26" y="21" fill="#f4f4f5">Java</text>
    </g>
    <!-- Spring -->
    <g transform="translate(102,0)">
      <rect width="118" height="32" rx="8" fill="#1c1f26" stroke="#6DB33F" stroke-width="1.5"/>
      <circle cx="14" cy="16" r="4" fill="#6DB33F"/>
      <text x="26" y="21" fill="#f4f4f5">Spring Boot</text>
    </g>
    <!-- NestJS -->
    <g transform="translate(230,0)">
      <rect width="94" height="32" rx="8" fill="#1c1f26" stroke="#E0234E" stroke-width="1.5"/>
      <circle cx="14" cy="16" r="4" fill="#E0234E"/>
      <text x="26" y="21" fill="#f4f4f5">NestJS</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(334,0)">
      <rect width="120" height="32" rx="8" fill="#1c1f26" stroke="#3178C6" stroke-width="1.5"/>
      <circle cx="14" cy="16" r="4" fill="#3178C6"/>
      <text x="26" y="21" fill="#f4f4f5">TypeScript</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(464,0)">
      <rect width="124" height="32" rx="8" fill="#1c1f26" stroke="#336791" stroke-width="1.5"/>
      <circle cx="14" cy="16" r="4" fill="#4FC3F7"/>
      <text x="26" y="21" fill="#f4f4f5">PostgreSQL</text>
    </g>
    <!-- Docker -->
    <g transform="translate(598,0)">
      <rect width="98" height="32" rx="8" fill="#1c1f26" stroke="#2496ED" stroke-width="1.5"/>
      <circle cx="14" cy="16" r="4" fill="#2496ED"/>
      <text x="26" y="21" fill="#f4f4f5">Docker</text>
    </g>
  </g>

  <!-- Second row: principles -->
  <g transform="translate(72,270)" font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="13" fill="#7d8590">
    <text>
      <tspan fill="#a78bfa">▹</tspan>  Clean Architecture
      <tspan dx="14" fill="#22d3ee">▹</tspan>  Spec-Driven Development
      <tspan dx="14" fill="#34d399">▹</tspan>  LLMs &amp; MCPs
      <tspan dx="14" fill="#f472b6">▹</tspan>  CI/CD
      <tspan dx="14" fill="#fbbf24">▹</tspan>  Team Leadership
    </text>
  </g>

  <!-- Right side: terminal card -->
  <g transform="translate(820,70)" filter="url(#soft)">
    <rect width="320" height="180" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <!-- title bar -->
    <rect width="320" height="32" rx="14" fill="#161b22"/>
    <rect y="16" width="320" height="16" fill="#161b22"/>
    <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="34" cy="16" r="5" fill="#febc2e"/>
    <circle cx="52" cy="16" r="5" fill="#28c840"/>
    <text x="160" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#7d8590">~/murillo — zsh</text>

    <!-- terminal content -->
    <g font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="12">
      <text x="16" y="58" fill="#7d8590">$ <tspan fill="#a78bfa">whoami</tspan></text>
      <text x="16" y="78" fill="#e6edf3">murillo.weiss</text>

      <text x="16" y="102" fill="#7d8590">$ <tspan fill="#a78bfa">cat</tspan> <tspan fill="#34d399">role.json</tspan></text>
      <text x="16" y="120" fill="#e6edf3">{</text>
      <text x="28" y="136" fill="#79c0ff">"focus"<tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"back-end"</tspan><tspan fill="#e6edf3">,</tspan></text>
      <text x="28" y="152" fill="#79c0ff">"stack"<tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"Java · Node"</tspan><tspan fill="#e6edf3">,</tspan></text>
      <text x="28" y="168" fill="#79c0ff">"status"<tspan fill="#e6edf3">: </tspan><tspan fill="#7ee787">"open to work"</tspan></text>
      <text x="16" y="184" fill="#e6edf3">}</text>
    </g>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="317" width="1200" height="3" fill="url(#accent)"/>
</svg>
